<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Sonic Rift app icon, small-size master (24-32 px): the approved symbol simplified for
       few pixels: thicker rift ring with the two gaps, five bright bars, no grain or glow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16244A"/><stop offset="1" stop-color="#0B1020"/></linearGradient>
    <linearGradient id="rift" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#4F7BFF"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5BE3F7"/><stop offset=".5" stop-color="#9DB2FF"/><stop offset="1" stop-color="#C4B3FF"/></linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="31" height="31" rx="6.5" fill="none" stroke="#3A5A94" stroke-width="1"/>
  <!-- ring: r 10.6, two gaps (upper left, lower right) like the master's broken rift -->
  <circle cx="16" cy="16" r="10.6" fill="none" stroke="url(#rift)" stroke-width="2.4" stroke-linecap="round"
          stroke-dasharray="27 6.3 27 6.3" stroke-dashoffset="-3" transform="rotate(-35 16 16)"/>
  <g fill="url(#wave)">
    <rect x="9.6"  y="14"   width="1.8" height="4"  rx=".9"/>
    <rect x="12.6" y="11.5" width="1.8" height="9"  rx=".9"/>
    <rect x="15.1" y="9.5"  width="1.8" height="13" rx=".9"/>
    <rect x="17.6" y="11.5" width="1.8" height="9"  rx=".9"/>
    <rect x="20.6" y="14"   width="1.8" height="4"  rx=".9"/>
  </g>
</svg>
